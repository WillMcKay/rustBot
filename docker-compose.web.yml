services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - STEAM_SECRET=${STEAM_API_KEY}
      - RUSTBOT_API_SECRET=${RUSTBOT_API_SECRET}
      - RUSTBOT_API_URL=${RUSTBOT_API_URL}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
