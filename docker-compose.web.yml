version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rustbot-web
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${API_DOMAIN}
      - NEXTAUTH_URL=https://${WEB_DOMAIN}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - RUSTBOT_API_SECRET=${RUSTBOT_API_SECRET}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rustbot-web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.rustbot-web.entrypoints=websecure"
      - "traefik.http.routers.rustbot-web.tls=true"
      - "traefik.http.routers.rustbot-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.rustbot-web.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
