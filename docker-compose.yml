version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rustbot-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - RUSTBOT_API_SECRET=${RUSTBOT_API_SECRET}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - rustbot-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rustbot-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - RUSTBOT_API_SECRET=${RUSTBOT_API_SECRET}
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rustbot-network

networks:
  rustbot-network:
    driver: bridge
